[project]
name = "hrus-worker"
version = "0.1.0"
description = "Celery worker AI-Native HRIS. Logic job ada di backend/app/jobs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6",
    "hrus-backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
hrus-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
