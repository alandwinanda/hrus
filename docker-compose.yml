# Stack dev lokal. Jalankan lewat `make up` (otomatis membuat .env dari .env.example).
name: hrus

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}
  AI_ENABLED: ${AI_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Aplikasi: user non-superuser lewat PgBouncer (tunduk RLS).
  # Migrasi dan CLI admin: owner langsung ke PostgreSQL.
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  APP_DB_USER: ${APP_DB_USER}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}

x-backend: &backend
  build:
    context: ./backend
  environment:
    <<: *app-env
    WEB_CONCURRENCY: ${BACKEND_WEB_CONCURRENCY:-2}
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
  stop_grace_period: 35s
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: postgres
      # Hanya user aplikasi yang lewat PgBouncer. User ini dibuat oleh `make migrate`.
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend-1:
    <<: *backend

  backend-2:
    <<: *backend

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  # Internal saja, tidak dibuka lewat nginx. Nanti dipanggil orchestrator.
  ai-gateway:
    build:
      context: ./ai-gateway
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
