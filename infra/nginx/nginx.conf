worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"upstream":"$upstream_addr","request_time":$request_time}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Pakai X-Request-ID dari client kalau ada, selain itu buat baru. Diteruskan ke backend.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # least_conn: durasi request sangat bervariasi (terutama nanti request AI).
    # max_fails/fail_timeout: passive health check, replika yang gagal dikeluarkan sementara.
    upstream backend {
        least_conn;
        server backend-1:8000 max_fails=3 fail_timeout=10s;
        server backend-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # /api/leave/requests → backend /leave/requests
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Vite dev server, termasuk websocket HMR.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }
}
